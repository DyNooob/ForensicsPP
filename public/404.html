<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0061A4" />
    <title>Forensics++ - Page Not Found</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
        --bg: #f8fafc;
        --surface: #ffffff;
        --ink: #111827;
        --muted: #5f6b7a;
        --line: #d7dde7;
        --accent: #0061a4;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101417;
          --surface: #151a1d;
          --ink: #e4e8ee;
          --muted: #b7c0cb;
          --line: #394149;
          --accent: #9bcaff;
        }
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
      }

      main {
        width: min(520px, calc(100% - 32px));
        border: 1px solid var(--line);
        border-top: 4px solid var(--accent);
        border-radius: 8px;
        background: var(--surface);
        padding: 24px;
      }

      strong {
        display: inline-grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 6px;
        background: var(--accent);
        color: #07111f;
        font-weight: 900;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        color: var(--accent);
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>F++</strong>
      <h1>Page not found</h1>
      <p>The requested page does not exist. Return to the Forensics++ workbench.</p>
      <a href="./">Open Forensics++</a>
    </main>
  </body>
</html>
