name: Deploy static build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_cdn:
        description: Use already-uploaded and verified matching CDN resources
        required: false
        default: false
        type: boolean
      source_ref:
        description: Optional application source tag/commit to deploy with this workflow
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VENDOR_CDN_URL: ${{ inputs.use_cdn && vars.VENDOR_CDN_URL || '' }}
      ASSET_CDN_URL: ${{ inputs.use_cdn && vars.ASSET_CDN_URL || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build production site
        run: npm run verify

      - name: Verify deployment artifact
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test ! -e dist/.git
          test -z "$(find dist -type d -name .git -print -quit)"

      - name: Verify uploaded vendor CDN resources
        if: env.VENDOR_CDN_URL != '' && env.ASSET_CDN_URL == ''
        run: node scripts/package-vendor-cdn.mjs && npm run verify:cdn

      - name: Verify uploaded full resource CDN
        if: env.ASSET_CDN_URL != ''
        run: node scripts/package-resource-cdn.mjs && npm run verify:resources

      - name: Preserve resources referenced by cached pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep prior Pages assets, including the self-origin build before a CDN
          # switch. Retain inherited files too, so an open lazy-loaded tool works.
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?status=success&per_page=2" --jq '.workflow_runs[].id' > "${RUNNER_TEMP}/previous-page-runs.txt"
          mapfile -t PREVIOUS_RUNS < "${RUNNER_TEMP}/previous-page-runs.txt"
          PREVIOUS_ROOTS=()
          for RUN_ID in "${PREVIOUS_RUNS[@]}"; do
            PREVIOUS_DIR="${RUNNER_TEMP}/pages-${RUN_ID}"
            mkdir -p "${PREVIOUS_DIR}/site"
            gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name github-pages --dir "${PREVIOUS_DIR}"
            tar -xf "${PREVIOUS_DIR}/artifact.tar" -C "${PREVIOUS_DIR}/site"
            PREVIOUS_ROOTS+=("${PREVIOUS_DIR}/site")
          done
          if [ "${#PREVIOUS_ROOTS[@]}" -gt 0 ]; then
            # Read the deployment helper from the workflow revision even when
            # redeploying an older application tag during incident recovery.
            git show "${GITHUB_WORKFLOW_SHA}:scripts/retain-deployment-assets.mjs" > "${RUNNER_TEMP}/retain-deployment-assets.mjs"
            node "${RUNNER_TEMP}/retain-deployment-assets.mjs" dist "${PREVIOUS_ROOTS[@]}"
            git show "${GITHUB_WORKFLOW_SHA}:scripts/verify-dist.mjs" > scripts/verify-deployment-assets.mjs
            node scripts/verify-deployment-assets.mjs
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    timeout-minutes: 35
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000

# The canonical site is deployed to GitHub Pages from the built `dist/` artifact
# produced by this workflow. Build verification runs before any deployment.
