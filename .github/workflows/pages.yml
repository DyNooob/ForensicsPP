name: Verify static build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build production site
        run: npm run verify

      - name: Verify deployment artifact
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test ! -e dist/.git
          test -z "$(find dist -type d -name .git -print -quit)"

# The canonical site is published from the GitHub repository. This workflow is
# deliberately limited to build verification and has no deployment permission.
