name: Verify release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.0-alpha.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG}"
          VERSION="${TAG#v}"
          test "$(node -p "require('./package.json').version")" = "${VERSION}"
          test -f "docs/releases/v${VERSION}.md"

      - name: Verify and build
        run: npm run verify

      - name: Create static release package
        run: npm run release:package

      - name: Confirm package exists
        shell: bash
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          test -f "release/ForensicsPP-${VERSION}-static.zip"
          test -f "release/SHA256SUMS.txt"

# This workflow intentionally verifies and packages only. It never creates a
# GitHub Release, deploys a site, or pushes tags. Publish through the GitHub
# remote and its release interface after the local checks pass.
