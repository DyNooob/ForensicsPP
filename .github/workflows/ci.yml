name: Verify source

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run verify

      - name: Verify clean artifact boundary
        shell: bash
        run: |
          test -f dist/index.html
          test ! -e dist/.git
          test -z "$(find dist -type d -name .git -print -quit)"
