name: Feature request
description: Propose a focused workflow or forensic capability.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: User workflow
      description: Describe the task a user needs to complete, not only a control or library.
    validations:
      required: true
  - type: textarea
    id: input-output
    attributes:
      label: Input and expected output
      description: State the accepted input, essential result fields and export needs.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Format references or public samples
      description: Link specifications, authoritative documentation or non-sensitive samples.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: The proposal can run in the browser without uploading evidence to a Forensics++ backend.
          required: true
